# C5 — outbound allowlist. The agent container has no route to the LAN or the internet
# except through here, so this file *is* the egress policy. Everything not listed is
# denied, and a denied request is logged with its target (TM-014 exfiltration path).
#
# THE MOUNT NAME MATTERS. squid.conf pulls `conf.d/*.conf` in *filename* order and the
# Ubuntu image ships `conf.d/debian.conf`, whose last line is `http_access allow localnet`
# - and `localnet` includes 172.16.0.0/12, i.e. every address in this stack. Mounted as
# `dshbot-rules.conf` this file was read second, so the distro rule matched first and the
# "allowlist" was decorative: measured `CONNECT example.com:443` -> TCP_TUNNEL/200 from the
# broker. It is therefore mounted as `a01-dshbot-rules.conf` (before debian.conf) and ends
# in an explicit `deny all`, which is terminal - rules in the files after it never run.
acl dshbot_allowed dstdomain api.deepseek.com
acl dshbot_allowed dstdomain api.telegram.org
acl dshbot_allowed dstdomain github.com
acl dshbot_allowed dstdomain registry.npmjs.org
# Loopback-to-loopback is never proxied; NO_PROXY in the container env covers it too.
acl dshbot_internal dst 172.28.0.0/16 10.0.0.0/8 192.168.0.0/16 127.0.0.0/8
acl dshbot_method method CONNECT GET POST HEAD
http_access deny !dshbot_method
http_access deny dshbot_internal
http_access allow dshbot_allowed
# Explicit deny + log for anything else: a silent drop makes an exfiltration attempt
# indistinguishable from a network glitch. Terminal, by squid's first-match rule - this is
# what keeps `http_access allow localnet` in debian.conf from re-opening the tunnel.
http_access deny all
cache deny all
